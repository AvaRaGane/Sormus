<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colmi R12 SpO2 & HR Logger</title>
  <style>
    body {
      background-color: #0d0d0d;
      color: #e0e0e0;
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }
    h1 { font-size: 1.4rem; color: #ff5252; margin-top: 0; }
    .card {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    button {
      background: #2e7d32;
      color: white;
      border: none;
      padding: 14px 18px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      width: 100%;
      margin-bottom: 10px;
      cursor: pointer;
    }
    button:disabled { background: #444; color: #888; cursor: not-allowed; }
    button.secondary { background: #1976d2; }
    button.danger { background: #c62828; }
    .row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
    input[type="number"] {
      background: #2a2a2a;
      color: white;
      border: 1px solid #444;
      padding: 10px;
      border-radius: 6px;
      width: 80px;
      font-size: 1rem;
    }
    #status { font-weight: bold; color: #ffd54f; margin-bottom: 10px; }
    #log {
      background: #000;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px;
      height: 240px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.85rem;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>Colmi R12 – SpO2 & Syke -yöseuranta</h1>

  <div class="card">
    <div id="status">Tila: Ei yhdistetty</div>
    <button id="btnConnect">1. Yhdistä sormukseen</button>

    <div class="row">
      <label for="intervalMin">Mittausväli (min):</label>
      <input type="number" id="intervalMin" value="2.5" min="1" max="60" step="0.5">
    </div>

    <div class="row">
      <button id="btnTestSpo2" class="secondary" style="margin-bottom:0;" disabled>Mittaa SpO2</button>
      <button id="btnTestHr" class="secondary" style="margin-bottom:0;" disabled>Mittaa Syke</button>
    </div>

    <button id="btnStart" disabled>2. Aloita automaattinen seuranta (molemmat)</button>
    <button id="btnStop" class="danger" disabled>Lopeta seuranta</button>
  </div>

  <div class="card">
    <div class="row">
      <button id="btnCsv" class="secondary" style="margin-bottom:0;">Lataa CSV</button>
      <button id="btnClear" class="danger" style="margin-bottom:0; width: 40%;">Tyhjennä</button>
    </div>
  </div>

  <div id="log"></div>

  <script>
    const SERVICE_UUID = '6e40fff0-b5a3-f393-e0a9-e50e24dcca9e';
    const WRITE_UUID   = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
    const NOTIFY_UUID  = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

    let device = null;
    let writeChar = null;
    let notifyChar = null;
    let timerId = null;
    let wakeLock = null;
    let currentSpo2 = [];
    let currentHr = [];
    let activeMode = null; // 'spo2' | 'hr' | null

    let logs = JSON.parse(localStorage.getItem('colmi_spo2_hr_logs') || '[]');

    const elStatus = document.getElementById('status');
    const elLog = document.getElementById('log');
    const btnConnect = document.getElementById('btnConnect');
    const btnTestSpo2 = document.getElementById('btnTestSpo2');
    const btnTestHr = document.getElementById('btnTestHr');
    const btnStart = document.getElementById('btnStart');
    const btnStop = document.getElementById('btnStop');

    function addLog(msg) {
      const time = new Date().toLocaleTimeString('fi-FI');
      elLog.textContent = `[${time}] ${msg}\n` + elLog.textContent;
    }

    function makePacket(cmd, payload = []) {
      const pkt = new Uint8Array(16);
      pkt[0] = cmd;
      for (let i = 0; i < payload.length && i < 14; i++) {
        pkt[i + 1] = payload[i];
      }
      let sum = 0;
      for (let i = 0; i < 15; i++) sum += pkt[i];
      pkt[15] = sum & 0xFF;
      return pkt;
    }

    function calcMedian(arr) {
      if (arr.length === 0) return '';
      const sorted = [...arr].sort((a, b) => a - b);
      const mid = Math.floor(sorted.length / 2);
      return sorted.length % 2 !== 0 ? sorted[mid] : ((sorted[mid - 1] + sorted[mid]) / 2).toFixed(1);
    }

    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          addLog('Näytön lukitus (Wake Lock) aktivoitu.');
        } catch (e) {
          addLog('Wake Lock ei onnistunut: ' + e.message);
        }
      }
    }

    function handleNotification(event) {
      const data = new Uint8Array(event.target.value.buffer);
      if (!activeMode) return;

      // SpO2 (tyyppi 0x03)
      if (activeMode === 'spo2') {
        if (data[0] === 0x6A && data[1] === 0x03) {
          const val = data[2];
          if (val >= 50 && val <= 100) {
            currentSpo2.push(val);
            addLog(`  -> SpO2-tulos: ${val}%`);
          }
        } else if (data[0] === 0x69 && data[1] === 0x03) {
          const val = data[3];
          if (val >= 50 && val <= 100) {
            currentSpo2.push(val);
            addLog(`  -> SpO2-lukema: ${val}%`);
          }
        }
      }

      // Syke / HR (tyyppi 0x01)
      if (activeMode === 'hr') {
        const hex = Array.from(data.slice(0, 6)).map(b => b.toString(16).padStart(2, '0')).join(' ');
        addLog(`  RAW HR: ${hex}`);

        if (data[0] === 0x6A && data[1] === 0x01) {
          const val = data[2];
          if (val >= 35 && val <= 220) {
            currentHr.push(val);
            addLog(`  -> Syke-tulos: ${val} bpm`);
          }
        } else if (data[0] === 0x69 && data[1] === 0x01) {
          const val = data[3];
          if (val >= 35 && val <= 220) {
            currentHr.push(val);
            addLog(`  -> Syke-lukema: ${val} bpm`);
          }
        }
      }
    }

    async function ensureConnected() {
      if (device && device.gatt.connected) return true;
      if (!device) return false;

      addLog('Yhteys poikki, yritetään yhdistää uudelleen...');
      try {
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        writeChar = await service.getCharacteristic(WRITE_UUID);
        notifyChar = await service.getCharacteristic(NOTIFY_UUID);
        await notifyChar.startNotifications();
        notifyChar.addEventListener('characteristicvaluechanged', handleNotification);
        elStatus.textContent = `Tila: Yhdistetty (${device.name})`;
        return true;
      } catch (e) {
        addLog('Uudelleenyhdistys epäonnistui: ' + e.message);
        return false;
      }
    }

    async function connectRing() {
      try {
        elStatus.textContent = 'Tila: Etsitään sormusta...';
        device = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'R02' }, { namePrefix: 'R12' }, { namePrefix: 'COLMI' }],
          optionalServices: [SERVICE_UUID]
        });

        device.addEventListener('gattserverdisconnected', () => {
          elStatus.textContent = 'Tila: Yhteys katkesi!';
          addLog('Bluetooth-yhteys katkesi.');
          btnTestSpo2.disabled = true;
          btnTestHr.disabled = true;
        });

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        writeChar = await service.getCharacteristic(WRITE_UUID);
        notifyChar = await service.getCharacteristic(NOTIFY_UUID);

        await notifyChar.startNotifications();
        notifyChar.addEventListener('characteristicvaluechanged', handleNotification);

        elStatus.textContent = `Tila: Yhdistetty (${device.name})`;
        addLog(`Yhdistetty laitteeseen ${device.name}`);
        btnTestSpo2.disabled = false;
        btnTestHr.disabled = false;
        btnStart.disabled = false;
      } catch (err) {
        elStatus.textContent = 'Tila: Yhdistys epäonnistui';
        addLog('Virhe: ' + err.message);
      }
    }

    async function runSpo2() {
      currentSpo2 = [];
      activeMode = 'spo2';
      addLog('Aloitetaan SpO2-mittaus (25 s)...');
      try {
        await writeChar.writeValue(makePacket(0x69, [0x03, 0x01]));
        await new Promise(r => setTimeout(r, 25000));
        await writeChar.writeValue(makePacket(0x6A, [0x03, 0x00]));
        await new Promise(r => setTimeout(r, 2000));
      } catch (e) {
        addLog('SpO2-mittausvirhe: ' + e.message);
      }
      activeMode = null;
    }

    async function runHr() {
      currentHr = [];
      activeMode = 'hr';
      addLog('Aloitetaan sykemittaus (20 s)...');
      try {
        await writeChar.writeValue(makePacket(0x69, [0x01, 0x01]));
        await new Promise(r => setTimeout(r, 20000));
        await writeChar.writeValue(makePacket(0x6A, [0x01, 0x00]));
        await new Promise(r => setTimeout(r, 2000));
      } catch (e) {
        addLog('Sykemittausvirhe: ' + e.message);
      }
      activeMode = null;
    }

    async function measure(mode = 'both') {
      if (activeMode) {
        addLog('Mittaus on jo käynnissä.');
        return;
      }
      if (!(await ensureConnected())) return;

      currentSpo2 = [];
      currentHr = [];

      if (mode === 'spo2' || mode === 'both') {
        await runSpo2();
      }
      if (mode === 'both') {
        await
